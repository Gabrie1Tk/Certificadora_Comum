<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gabarito - Aula 04 LocalStorage</title>
  
  <style>
    /* CSS Base das aulas anteriores ocultado por brevidade, 
       assuma que o estilo de layout, grid e filtros continua aqui */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; padding: 20px; }
    .catalogo-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 20px; }
    .cartao { border: 1px solid #e2e8f0; border-radius: 8px; padding: 15px; display: flex; flex-direction: column; }
    .cartao__imagem { width: 100%; height: auto; border-radius: 4px; margin-bottom: 15px; }
    .cartao__corpo { flex-grow: 1; }
    .cartao__rodape { margin-top: 15px; text-align: right; }
    
    /* =========================================
       NOVOS ESTILOS PARA A AULA 04 (FAVORITOS)
       ========================================= */
    .btn-favoritar {
      background: none;
      border: 1px solid #cbd5e1;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-size: 1.2rem;
      cursor: pointer;
      transition: all 0.2s ease;
      /* Estado padrão: coração vazio (usaremos um emoji em P&B ou opacidade) */
      opacity: 0.5;
      filter: grayscale(100%);
    }

    /* Classe adicionada via JavaScript quando o carro é favoritado */
    .btn-favoritar.favoritado {
      opacity: 1;
      filter: grayscale(0%);
      border-color: #ef4444; /* Borda vermelha */
      background-color: #fef2f2; /* Fundo levemente vermelho */
      transform: scale(1.1); /* Dá um pequeno destaque no tamanho */
    }
  </style>
</head>
<body>

  <main>
    <section id="catalogo" style="margin-top: 40px;">
      <h2 style="text-align: center;">Catálogo de Carros</h2>

      <div class="catalogo-grid">
        
        <article class="cartao" data-categoria="sedan">
          <img src="../../assets/imgs/civic.jpg" alt="Honda Civic" class="cartao__imagem">
          <div class="cartao__corpo">
            <h3 class="cartao__nome">Civic</h3>
            <p class="cartao__marca">Honda - 2023</p>
          </div>
          <div class="cartao__rodape">
            <button class="btn-favoritar" data-id="carro-civic" aria-label="Favoritar Civic">❤️</button>
          </div>
        </article>

        <article class="cartao" data-categoria="sedan">
          <img src="../../assets/imgs/corolla.jpg" alt="Toyota Corolla" class="cartao__imagem">
          <div class="cartao__corpo">
            <h3 class="cartao__nome">Corolla</h3>
            <p class="cartao__marca">Toyota - 2023</p>
          </div>
          <div class="cartao__rodape">
            <button class="btn-favoritar" data-id="carro-corolla" aria-label="Favoritar Corolla">❤️</button>
          </div>
        </article>

        <article class="cartao" data-categoria="suv">
          <img src="../../assets/imgs/compass.jpg" alt="Jeep Compass" class="cartao__imagem">
          <div class="cartao__corpo">
            <h3 class="cartao__nome">Compass</h3>
            <p class="cartao__marca">Jeep - 2023</p>
          </div>
          <div class="cartao__rodape">
            <button class="btn-favoritar" data-id="carro-compass" aria-label="Favoritar Compass">❤️</button>
          </div>
        </article>

      </div>
    </section>
  </main>

  <script>
    // Seleciona todos os botões de favoritar
    const botoesFavoritar = document.querySelectorAll('.btn-favoritar');

    // EXERCÍCIO 1: Inicializando os Favoritos
    // Tenta buscar o texto no localStorage. Se existir, converte para array (JSON.parse).
    // Se retornar null, inicia um array vazio usando o operador || (ou).
    let favoritos = JSON.parse(localStorage.getItem('carrosFavoritos')) || [];

    // EXERCÍCIO 3: Atualizando a Interface
    function atualizarInterfaceFavoritos() {
      botoesFavoritar.forEach(botao => {
        const idCarro = botao.getAttribute('data-id');
        
        // Verifica se o ID deste botão está no array de favoritos
        if (favoritos.includes(idCarro)) {
          botao.classList.add('favoritado');
        } else {
          botao.classList.remove('favoritado');
        }
      });
    }

    // EXERCÍCIO 2: Lógica de Adicionar e Remover
    botoesFavoritar.forEach(botao => {
      botao.addEventListener('click', () => {
        const idCarro = botao.getAttribute('data-id');

        // Verifica a posição do carro no array (-1 significa que não encontrou)
        const index = favoritos.indexOf(idCarro);

        if (index === -1) {
          // Não está nos favoritos, então adicionamos
          favoritos.push(idCarro);
        } else {
          // Já está nos favoritos, então removemos (corta 1 item na posição 'index')
          favoritos.splice(index, 1);
        }

        // Salva o array atualizado no LocalStorage convertendo para texto (JSON.stringify)
        localStorage.setItem('carrosFavoritos', JSON.stringify(favoritos));

        // Atualiza a tela para refletir as mudanças imediatamente
        atualizarInterfaceFavoritos();
      });
    });

    // Chama a função logo que a página carrega para pintar os botões corretamente
    atualizarInterfaceFavoritos();
  </script>

</body>
</html>
