<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gabarito - Aula 03 JavaScript e DOM</title>
  
  <style>
    /* CSS Base das aulas anteriores */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; padding: 20px; }
    .nav__links { display: flex; justify-content: space-between; align-items: center; list-style: none; background-color: #f1f5f9; padding: 15px 30px; border-radius: 8px; }
    .nav__links a { text-decoration: none; color: #0f172a; font-weight: 700; }
    .catalogo-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 20px; }
    .cartao { border: 1px solid #e2e8f0; border-radius: 8px; padding: 15px; display: flex; flex-direction: column; }
    .cartao__imagem { width: 100%; height: auto; border-radius: 4px; margin-bottom: 15px; }
    .cartao__corpo { flex-grow: 1; }
    .cartao__rodape { margin-top: 15px; text-align: right; }
    
    /* =========================================
       NOVOS ESTILOS PARA A AULA 03 (FILTROS)
       ========================================= */
    .filtros {
      margin-top: 20px;
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .btn-filtro {
      padding: 8px 16px;
      border: 1px solid #cbd5e1;
      background-color: white;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.3s ease;
    }

    .btn-filtro:hover, .btn-filtro.ativo {
      background-color: #0f172a;
      color: white;
    }

    /* Classe crucial para o Exercício 3: Ocultar elementos via JS */
    .oculto {
      display: none !important;
    }
  </style>
</head>
<body>

  <header class="site-header">
    <nav class="nav" aria-label="Navegação principal">
      <ul class="nav__links" role="list">
        <li><a href="#apresentacao">Início</a></li>
        <li><a href="#catalogo">Catálogo</a></li>
        <li><a href="#contato">Contato</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="catalogo" style="margin-top: 40px;">
      <h2 style="text-align: center;">Catálogo de Carros</h2>

      <div class="filtros">
        <button class="btn-filtro ativo" data-filtro="todos">Todos</button>
        <button class="btn-filtro" data-filtro="sedan">Sedan</button>
        <button class="btn-filtro" data-filtro="suv">SUV</button>
      </div>

      <div class="catalogo-grid">
        
        <article class="cartao" data-categoria="sedan">
          <img src="../../assets/imgs/civic.jpg" alt="Honda Civic" class="cartao__imagem">
          <div class="cartao__corpo">
            <p class="cartao__categoria">Sedan</p>
            <h3 class="cartao__nome">Civic</h3>
            <p class="cartao__marca">Honda - 2023</p>
            <p class="cartao__preco">R$ 149.900</p>
          </div>
          <div class="cartao__rodape">
            <button class="btn-favoritar">❤️</button>
          </div>
        </article>

        <article class="cartao" data-categoria="sedan">
          <img src="../../assets/imgs/corolla.jpg" alt="Toyota Corolla" class="cartao__imagem">
          <div class="cartao__corpo">
            <p class="cartao__categoria">Sedan</p>
            <h3 class="cartao__nome">Corolla</h3>
            <p class="cartao__marca">Toyota - 2023</p>
            <p class="cartao__preco">R$ 155.000</p>
          </div>
          <div class="cartao__rodape">
            <button class="btn-favoritar">❤️</button>
          </div>
        </article>

        <article class="cartao" data-categoria="suv">
          <img src="../../assets/imgs/compass.jpg" alt="Jeep Compass" class="cartao__imagem">
          <div class="cartao__corpo">
            <p class="cartao__categoria">SUV</p>
            <h3 class="cartao__nome">Compass</h3>
            <p class="cartao__marca">Jeep - 2023</p>
            <p class="cartao__preco">R$ 180.500</p>
          </div>
          <div class="cartao__rodape">
            <button class="btn-favoritar">❤️</button>
          </div>
        </article>

      </div>
    </section>
  </main>

  <script>
    // Exercício 1: Selecionando Elementos do DOM
    const botoesFiltro = document.querySelectorAll('.btn-filtro');
    const cartoes = document.querySelectorAll('.cartao');

    // Exercício 2: Escutando Eventos de Clique
    botoesFiltro.forEach(botao => {
      botao.addEventListener('click', () => {
        
        // Remove a classe 'ativo' de todos os botões e adiciona no clicado
        botoesFiltro.forEach(btn => btn.classList.remove('ativo'));
        botao.classList.add('ativo');

        // Captura o valor que queremos filtrar a partir do data-attribute do botão
        const categoriaEscolhida = botao.getAttribute('data-filtro');

        // Exercício 3: Lógica do Filtro em Tempo Real
        cartoes.forEach(cartao => {
          const categoriaDoCartao = cartao.getAttribute('data-categoria');

          // Se escolheu "todos" ou se a categoria do cartão for igual à escolhida
          if (categoriaEscolhida === 'todos' || categoriaEscolhida === categoriaDoCartao) {
            cartao.classList.remove('oculto'); // Mostra o cartão
          } else {
            cartao.classList.add('oculto'); // Esconde o cartão
          }
        });
        
      });
    });
  </script>

</body>
</html>
